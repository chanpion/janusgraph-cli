# SLF4J Simple Logger 配置
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=false
org.slf4j.simpleLogger.showShortLogName=true

# 抑制 HBase / Hadoop / ZooKeeper / JanusGraph 内部 DEBUG 日志
org.slf4j.simpleLogger.log.org.apache.hadoop=warn
org.slf4j.simpleLogger.log.org.apache.hbase=warn
org.slf4j.simpleLogger.log.org.apache.zookeeper=warn
org.slf4j.simpleLogger.log.org.janusgraph.graphdb=warn
org.slf4j.simpleLogger.log.org.janusgraph.diskstorage=warn
