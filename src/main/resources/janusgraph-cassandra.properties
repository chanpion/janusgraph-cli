# ============================================
# JanusGraph Cassandra (CQL) 配置文件
# ============================================

# 基础存储配置
storage.backend=cql
storage.hostname=10.58.12.60
storage.port=9042
storage.cql.keyspace=janus_demo
storage.cql.local-datacenter=datacenter1
storage.cql.replication-factor=1
storage.cql.read-consistency-level=LOCAL_QUORUM
storage.cql.write-consistency-level=LOCAL_QUORUM

# 用户名密码认证（config show 中 password 会自动遮掩）
storage.username=cassandra
storage.password=cassandra

# 连接超时配置
storage.connection-timeout=60000
storage.operation-timeout=60000

# ---------- 缓存配置（性能优化） ----------
storage.cache.db-cache=true
storage.cache.db-cache-clean-wait=20
storage.cache.db-cache-time=180000
storage.cache.db-cache-size=0.5

# 系统配置
graph.allow-upgrade=true
