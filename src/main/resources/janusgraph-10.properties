# ============================================
# JanusGraph HBase with Kerberos 配置文件
# ============================================

# 基础存储配置
storage.backend=hbase
storage.hostname=yuntu-qiye-e-010058011011.hz.td,yuntu-qiye-e-010058011012.hz.td,yuntu-qiye-e-010058011010.hz.td
storage.hbase.table=janus_demo
storage.hbase.ext.hbase.zookeeper.property.clientPort=2181
storage.hbase.ext.zookeeper.znode.parent=/hbase

# 连接超时配置
storage.connection-timeout=60000
storage.operation-timeout=60000
storage.lock.wait-time=10000

# Kerberos认证配置
storage.hbase.ext.hbase.security.authentication=simple
storage.hbase.ext.hbase.security.authorization=false
storage.hbase.ext.hadoop.security.authentication=simple
storage.hbase.ext.hadoop.security.authorization=false

# HBase客户端配置
storage.hbase.ext.hbase.rpc.timeout=60000
storage.hbase.ext.hbase.client.retries.number=3
storage.hbase.ext.hbase.client.scanner.caching=100

# 系统配置
graph.allow-upgrade=true

# 批量加载优化
storage.hbase.batch-load=true
# 默认 ID 分配方式
graph.tx-impl=org.janusgraph.graphdb.transaction.StandardJanusGraphTx


# ---------- 缓存配置（性能优化） ----------
# 数据库缓存大小
storage.cache.db-cache=true
storage.cache.db-cache-clean-wait=20
storage.cache.db-cache-time=180000
storage.cache.db-cache-size=0.5
# ---------- Kerberos keytab 登录（可选，集成自 JanusApp） ----------
# 通过配置文件控制 JAAS/krb5 系统属性和 keytab 登录
# 若已通过 -D 参数设置，此处配置不覆盖
janusapp.zookeeper.sasl.client=false
janusapp.krb5.debug=false
